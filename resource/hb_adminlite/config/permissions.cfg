#############################################################################################
#                              HB ADMIN LITE PERMISSIONS                                     #
#############################################################################################

# This file is meant to be executed from your server.cfg.
# Example:
#   exec resources/[local]/hb_adminlite/config/permissions.cfg
#
# Add your real server identifiers locally. Do not commit real license/discord identifiers
# to a public repository.

#####################################
#       PLAYERS / GROUPS SETUP      #
#####################################

# Example:
# add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.admin
# add_principal identifier.discord:YOUR_DISCORD_ID group.admin

#########################################
#           PERMISSIONS SETUP           #
#########################################

# Full access to every HB Admin Lite feature.
add_ace group.admin "hb_adminlite.Everything" allow

